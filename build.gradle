buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        //classpath "com.android.tools.build:gradle:4.2.2"
        classpath 'com.android.tools.build:gradle:7.1.3'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
